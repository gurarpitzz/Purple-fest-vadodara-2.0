<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .favicon-bg {
      fill: #FFFFFF;
      stroke: #C084FC;
      stroke-width: 1.5;
    }
    .emblem-curve {
      stroke: #6B21A8;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .emblem-heart {
      fill: #7C3AED;
    }
    @media (prefers-color-scheme: dark) {
      .favicon-bg {
        fill: #FFFFFF;
        stroke: #A855F7;
        stroke-width: 2;
      }
      .emblem-curve {
        stroke: #581C87;
      }
      .emblem-heart {
        fill: #6B21A8;
      }
    }
  </style>
  <!-- Crisp high-contrast rounded squircle container (guarantees clear visibility on dark/black browser tabs) -->
  <rect class="favicon-bg" x="3" y="3" width="58" height="58" rx="16" filter="url(#soft-shadow)"/>
  
