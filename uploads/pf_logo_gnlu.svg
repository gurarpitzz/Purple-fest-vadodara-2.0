<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" role="img" aria-label="Gujarat National Law University (GNLU), Gandhinagar Emblem">
  <defs>
    <linearGradient id="gnluCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B182C"/>
      <stop offset="100%" stop-color="#4E0D1B"/>
    </linearGradient>
    <linearGradient id="gnluGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6AC35"/>
      <stop offset="100%" stop-color="#B07A12"/>
    </linearGradient>
  </defs>

  <!-- Left Legal & Academic Crest Seal -->
  <g transform="translate(82, 80)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="url(#gnluCrimson)" stroke-width="3.2"/>
    <circle cx="0" cy="0" r="53" fill="#FDF8F2" stroke="url(#gnluGold)" stroke-width="1.8"/>
    <!-- Royal Law Shield -->
    <path d="M-31,-33 H31 V-3 C31,21 0,36 0,36 C0,36 -31,21 -31,-3 Z" fill="url(#gnluCrimson)" stroke="url(#gnluGold)" stroke-width="2"/>
    <!-- Scales of Justice -->
    <line x1="0" y1="-25" x2="0" y2="16" stroke="#F6C85F" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-21" y1="-13" x2="21" y2="-13" stroke="#F6C85F" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="-25" r="3.5" fill="#F6C85F"/>
    <!-- Left Scale Pan -->
    <line x1="-20" y1="-13" x2="-25" y2="-1" stroke="#F6C85F" stroke-width="1.4"/>
    <line x1="-20" y1="-13" x2="-15" y2="-1" stroke="#F6C85F" stroke-width="1.4"/>
    <path d="M-27,-1 Q-20,6 -13,-1 Z" fill="#F6C85F"/>
    <!-- Right Scale Pan -->
    <line x1="20" y1="-13" x2="15" y2="-1" stroke="#F6C85F" stroke-width="1.4"/>
    <line x1="20" y1="-13" x2="25" y2="-1" stroke="#F6C85F" stroke-width="1.4"/>
    <path d="M13,-1 Q20,6 27,-1 Z" fill="#F6C85F"/>
    <!-- Open Constitutional Tome at Base -->
    <path d="M-18,16 Q-9,13 0,17 Q9,13 18,16 V24 Q9,21 0,25 Q-9,21 -18,24 Z" fill="#FFFFFF" stroke="#F6C85F" stroke-width="1.2"/>
    <!-- Motto Ribbon -->
    <path d="M-49,39 L49,39 L43,52 L-43,52 Z" fill="#1E2B4F" stroke="url(#gnluGold)" stroke-width="1.2"/>
    <text x="0" y="48.5" text-anchor="middle" fill="#FFE08A" font-family="serif" font-size="8" font-weight="700" letter-spacing="0.3">आ नो भद्राः क्रतवो यन्तु विश्वतः</text>
  </g>

  <!-- Right Institutional Lockup -->
  <g transform="translate(162, 32)">
    <text x="0" y="28" fill="#7B182C" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="900" letter-spacing="2">GNLU</text>
    <rect x="0" y="37" width="236" height="3" rx="1.5" fill="url(#gnluGold)"/>
    <text x="0" y="56" fill="#1E2B4F" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="0.3">GUJARAT NATIONAL</text>
    <text x="0" y="74" fill="#1E2B4F" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="0.3">LAW UNIVERSITY</text>
    <text x="0" y="93" fill="#7B182C" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.1">GANDHINAGAR · GUJARAT</text>
  </g>
</svg>
